<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>向坤坤怪开炮</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 10px 0;
    font-family: 'Arial', 'Microsoft YaHei', sans-serif;
    color: #fff;
    overflow-x: hidden;
    overflow-y: auto;
}
#hud {
    display: flex;
    align-items: center;
    gap: 40px;
    font-size: 20px;
    margin-bottom: 10px;
    text-shadow: 0 0 10px rgba(255,255,255,0.4);
    z-index: 10;
}
#hud span {
    background: rgba(0,0,0,0.5);
    padding: 6px 16px;
    border-radius: 8px;
}
.rage-btn {
    padding: 6px 16px;
    font-size: 16px;
    border: 2px solid #ff6600;
    border-radius: 8px;
    background: rgba(255,100,0,0.2);
    color: #ff6600;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s;
}
.rage-btn:hover {
    background: rgba(255,100,0,0.4);
    box-shadow: 0 0 12px rgba(255,100,0,0.5);
}
.rage-btn.active {
    background: #ff4400;
    color: #fff;
    border-color: #ff2200;
    box-shadow: 0 0 20px rgba(255,50,0,0.7);
    animation: pulse 0.6s infinite alternate;
}
@keyframes pulse {
    from { box-shadow: 0 0 12px rgba(255,50,0,0.5); }
    to   { box-shadow: 0 0 28px rgba(255,50,0,0.9); }
}
canvas {
    border: 2px solid #444;
    border-radius: 4px;
    background: linear-gradient(180deg, #0d0d2b 0%, #1a1040 50%, #2a1548 100%);
    display: block;
    max-width: 100vw;
    height: auto;
}
.overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.85);
    border: 2px solid #ffd700;
    border-radius: 16px;
    padding: 40px 50px;
    text-align: center;
    z-index: 100;
}
.overlay h1 {
    font-size: 36px;
    color: #ffd700;
    margin-bottom: 12px;
}
.overlay h2 {
    font-size: 30px;
    color: #ff4444;
    margin-bottom: 12px;
}
.overlay p {
    font-size: 18px;
    margin-bottom: 10px;
    color: #ddd;
}
.controls {
    text-align: left;
    margin: 16px 0;
    color: #ccc;
    font-size: 15px;
    line-height: 1.8;
}
.controls li {
    list-style: "🎮 ";
}
button {
    margin-top: 16px;
    padding: 12px 36px;
    font-size: 20px;
    border: none;
    border-radius: 8px;
    background: #ffd700;
    color: #1a1a2e;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.1s, box-shadow 0.1s;
}
button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(255,215,0,0.5);
}
button:active {
    transform: scale(0.97);
}
#mobileControls {
    display: none;
    width: 100%;
    max-width: 800px;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    gap: 12px;
    margin-top: 6px;
    box-sizing: border-box;
}
.ctrl-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 24px;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s;
}
.ctrl-btn:active,
.ctrl-btn.pressed {
    background: rgba(255,255,255,0.25);
    border-color: #ffd700;
}
.shoot-btn {
    width: 72px;
    height: 72px;
    font-size: 30px;
    background: rgba(255,50,50,0.15);
    border-color: rgba(255,80,80,0.5);
}
.shoot-btn:active,
.shoot-btn.pressed {
    background: rgba(255,50,50,0.35);
}
@media (max-width: 768px) {
    #mobileControls { display: flex; }
    #hud { gap: 12px; font-size: 14px; }
    #hud span { padding: 4px 10px; }
    .overlay { width: 90vw; padding: 24px 20px; }
    .overlay h1 { font-size: 24px; }
    .overlay h2 { font-size: 22px; }
    .overlay p { font-size: 14px; }
    .controls { font-size: 12px; }
    button { padding: 10px 28px; font-size: 16px; }
}
    </style>
</head>
<body>
    <div id="hud">
        <span>分数: <span id="score">0</span></span>
        <span>生命: <span id="lives">3</span></span>
        <span>等级: <span id="level">1</span></span>
        <button id="rageBtn" class="rage-btn">⚡暴走</button>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="mobileControls">
        <button id="btnLeft" class="ctrl-btn">◀</button>
        <button id="btnRight" class="ctrl-btn">▶</button>
        <button id="btnShoot" class="ctrl-btn shoot-btn">🔥</button>
    </div>
    <div id="startScreen" class="overlay">
        <h1>🐔 向坤坤怪开炮 🔫</h1>
        <p>坤坤怪正在靠近！消灭它们！</p>
        <ul class="controls">
            <li>A / D 或 ← / → 移动防御塔</li>
            <li>空格键 发射子弹</li>
        </ul>
        <button id="startBtn">开始游戏</button>
    </div>
    <div id="endScreen" class="overlay" style="display:none">
        <h2>游戏结束</h2>
        <p>最终分数: <span id="finalScore">0</span></p>
        <button id="restartBtn">重新开始</button>
    </div>

const TOWER_IMG_W = 60, ENEMY_IMG_W = 50;

// ========== 键盘状态 ==========
const keys = {};

// ========== 难度曲线 ==========
function getBulletSpeed() { return 8 + level * 0.5; }
function getSpawnDelay() {
    if (rageMode) return 10;
    return Math.max(10, Math.floor(60 / Math.pow(1.3, level - 1)));
}
function getEnemySpeed() {
    const base = 1.5 + level * 0.5;
    return rageMode ? base * 0.35 : base;
}

// ========== 重置 ==========
function resetGame() {
    score = 0; lives = 3; level = 1; rageMode = false;
    bullets = []; enemies = [];
    shootCooldown = 0; enemySpawnTimer = 0;
    enemySpawnDelay = getSpawnDelay();
    tower.x = W / 2 - tower.w / 2;
    rageBtn.classList.remove('active');
    rageBtn.textContent = '⚡暴走';
    updateHUD();
}
function updateHUD() {
    scoreEl.textContent = score;
    livesEl.textContent = rageMode ? '∞' : lives;
    levelEl.textContent = level;
}

// ========== 激光 ==========
const LASER_W = 10;
function fireLaser() {
    const lx = tower.x + tower.w / 2 - LASER_W / 2;
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.x > lx - e.radius && e.x < lx + LASER_W + e.radius) {
            enemies.splice(i, 1);
            score++;
            updateHUD();
            const nl = Math.floor(score / 10) + 1;
            if (nl !== level) { level = nl; updateHUD(); }
        }
    }
}

// ========== 碰撞 ==========
function bulletHitsEnemy(b, e) {
    const dx = b.x + b.w / 2 - e.x, dy = b.y + b.h / 2 - e.y;
    return Math.sqrt(dx * dx + dy * dy) < ENEMY_RADIUS + Math.max(b.w, b.h) / 2;
}

function spawnEnemy() {
    const x = Math.random() * (W - ENEMY_RADIUS * 2) + ENEMY_RADIUS;
    const img = rageMode ? enemyImages[Math.floor(Math.random() * enemyImages.length)] : enemyImg;
    enemies.push({ x, y: -ENEMY_RADIUS, img, radius: ENEMY_RADIUS, speed: getEnemySpeed(), wobble: Math.random() * Math.PI * 2 });
}

// ========== 更新 ==========
function update() {
    if (gameState !== 'playing') return;
    if (keys['KeyA'] || keys['ArrowLeft']) tower.x -= tower.speed;
    if (keys['KeyD'] || keys['ArrowRight']) tower.x += tower.speed;
    if (tower.x < 0) tower.x = 0;
    if (tower.x + tower.w > W) tower.x = W - tower.w;
    if (shootCooldown > 0) shootCooldown--;
    if (keys['Space'] && shootCooldown <= 0) {
        if (rageMode) { fireLaser(); }
        else { bullets.push({ x: tower.x + tower.w / 2 - BULLET_W / 2, y: tower.y, speed: getBulletSpeed(), w: BULLET_W, h: BULLET_H }); }
        shootCooldown = SHOOT_DELAY;
    }
    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed;
        if (bullets[i].y + bullets[i].h < 0) bullets.splice(i, 1);
    }
    enemySpawnTimer++;
    if (enemySpawnTimer >= enemySpawnDelay) {
        enemySpawnTimer = 0; enemySpawnDelay = getSpawnDelay();
        spawnEnemy();
        if (rageMode) { spawnEnemy(); spawnEnemy(); spawnEnemy(); }
    }
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.speed; e.wobble += 0.03; e.x += Math.sin(e.wobble) * 0.5;
        if (e.y - e.radius > H) { enemies.splice(i, 1); continue; }
        if (!rageMode) {
            const cx = Math.max(tower.x, Math.min(e.x, tower.x + tower.w));
            const cy = Math.max(tower.y, Math.min(e.y, tower.y + tower.h));
            if ((e.x - cx) ** 2 + (e.y - cy) ** 2 < e.radius ** 2) {
                enemies.splice(i, 1); lives--; updateHUD();
                if (lives <= 0) { endGame(); } continue;
            }
        }
        for (let j = bullets.length - 1; j >= 0; j--) {
            if (bulletHitsEnemy(bullets[j], e)) {
                bullets.splice(j, 1); enemies.splice(i, 1);
                score++; updateHUD();
                const nl = Math.floor(score / 10) + 1;
                if (nl !== level) { level = nl; updateHUD(); }
                break;
            }
        }
    }
}

// ========== 绘制 ==========
function drawTower() {
    const img = rageMode ? rageTowerImg : towerImg;
    if (img.complete) {
        const th = TOWER_IMG_W * (img.naturalHeight / img.naturalWidth);
        ctx.drawImage(img, tower.x, tower.y - th + tower.h, TOWER_IMG_W, th);
    } else {
        ctx.fillStyle = '#4a90d9'; ctx.fillRect(tower.x, tower.y + 10, tower.w, tower.h - 10);
        ctx.strokeStyle = '#2a5a8f'; ctx.lineWidth = 2;
        ctx.strokeRect(tower.x, tower.y + 10, tower.w, tower.h - 10);
    }
}
function drawBullet(b) {
    ctx.fillStyle = '#ffdd57'; ctx.shadowColor = '#ffdd57'; ctx.shadowBlur = 8;
    ctx.fillRect(b.x, b.y, b.w, b.h); ctx.shadowBlur = 0;
}
function drawLaser() {
    const lx = tower.x + tower.w / 2;
    ctx.strokeStyle = '#ff4444'; ctx.lineWidth = LASER_W;
    ctx.shadowColor = '#ff4444'; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.moveTo(lx, tower.y); ctx.lineTo(lx, 0); ctx.stroke();
    ctx.shadowBlur = 0;
}
function drawEnemy(e) {
    const img = e.img || enemyImg;
    if (img.complete) {
        const hw = ENEMY_IMG_W / 2;
        ctx.drawImage(img, e.x - hw, e.y - hw, ENEMY_IMG_W, ENEMY_IMG_W);
    } else {
        ctx.fillStyle = '#e8892e'; ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#a05b15'; ctx.lineWidth = 2; ctx.stroke();
    }
}
function drawDefenseLine() {
    ctx.strokeStyle = '#ff4444'; ctx.lineWidth = 3; ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.moveTo(0, H - 10); ctx.lineTo(W, H - 10); ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle = '#ff444466';
    ctx.font = '12px Arial'; ctx.fillText('⚠ 防线 ⚠', W - 90, H - 16);
}
function drawStage() {
    const g = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 500);
    g.addColorStop(0, 'rgba(255,255,255,0.03)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    for (let i = 0; i < 30; i++) {
        ctx.beginPath(); ctx.arc((i * 137 + 50) % W, (i * 97 + 30) % (H * 0.6), (i % 3) + 1, 0, Math.PI * 2); ctx.fill();
    }
}
function render() {
    ctx.clearRect(0, 0, W, H);
    if (gameState === 'start') {
        drawStage(); drawDefenseLine(); drawTower();
        ctx.fillStyle = '#ffd700'; ctx.font = '16px Arial';
        ctx.fillText('按"开始游戏"启动', W / 2 - 60, H / 2);
        return;
    }
    if (gameState === 'end') {
        drawStage(); drawDefenseLine(); drawTower();
        for (const b of bullets) drawBullet(b);
        for (const e of enemies) drawEnemy(e);
        return;
    }
    drawStage(); drawDefenseLine(); drawTower();
    for (const b of bullets) drawBullet(b);
    for (const e of enemies) drawEnemy(e);
    if (rageMode && keys['Space']) drawLaser();
}

// ========== 循环 ==========
function gameLoop() { update(); render(); requestAnimationFrame(gameLoop); }
function startGame() {
    resetGame(); gameState = 'playing';
    startScreen.style.display = 'none'; endScreen.style.display = 'none';
}
function endGame() {
    gameState = 'end'; finalScoreEl.textContent = score;
    endScreen.style.display = 'flex';
}

// ========== 暴走切换 ==========
function toggleRage() {
    if (gameState !== 'playing') return;
    if (rageMode) {
        rageMode = false; lives += 5;
        rageBtn.classList.remove('active'); rageBtn.textContent = '⚡暴走';
    } else {
        rageMode = true;
        rageBtn.classList.add('active'); rageBtn.textContent = '⚡暴走中';
    }
    updateHUD();
}

// ========== 事件 ==========
document.addEventListener('keydown', (e) => {
    keys[e.code] = true; if (e.code === 'Space') e.preventDefault();
});
document.addEventListener('keyup', (e) => { keys[e.code] = false; });
startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);
rageBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleRage(); });

const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');
const btnShoot = document.getElementById('btnShoot');
function bindButton(el, code) {
    if (!el) return;
    el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[code] = true; el.classList.add('pressed'); });
    el.addEventListener('touchend',   (e) => { e.preventDefault(); keys[code] = false; el.classList.remove('pressed'); });
    el.addEventListener('touchcancel',(e) => { keys[code] = false; el.classList.remove('pressed'); });
    el.addEventListener('mousedown',  (e) => { e.preventDefault(); keys[code] = true; el.classList.add('pressed'); });
    el.addEventListener('mouseup',    (e) => { e.preventDefault(); keys[code] = false; el.classList.remove('pressed'); });
    el.addEventListener('mouseleave', (e) => { keys[code] = false; el.classList.remove('pressed'); });
}
bindButton(btnLeft, 'ArrowLeft'); bindButton(btnRight, 'ArrowRight'); bindButton(btnShoot, 'Space');

resetGame(); requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
